<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education</title>
    <link rel="stylesheet" href="secondPageStyle.css">
</head>
<body>
	<div class="bod">
		<div class="barreGauche">
			<p>Education</p>
			<footer class="footer">
				<div class="click" >
					<a class="click1" id="Back" href="firstPage.html">Go back</a>
				</div>
				<div class="click" >
					<a class="click1" id="Next" href="thirdPage.html">Next</a>
				</div>
			</footer>
		</div>
		<div class="bod2">
			<div class="container">
						<div class="container2">
							<header class="block">
								<h2>Education</h2>	
							</header>
							<form action="">
								<div class="C3">
									<div class="c3">
										<label for="school">School Name *</label><br>
										<input type="text"  class="inputs" id ="school" name="school" required><br>
									</div>
									<div class="c3">
										<label for="city">City *</label><br>
										<input type="text"  class="inputs" id ="city" name="city" placeholder="e.g. New York" required><br>
									</div>
								</div>
								<div class="C3">
									<div class="c3">
										<label for="degree">Degree *</label><br>
										<input type="text"  class="inputs" id ="degree" name="degree"  placeholder="e.g. Master" required><br>
									</div>
									<div class="c3">
										<label for="study">Field of study </label><br>
										<input type="text"  class="inputs" id ="study" name="study" placeholder="e.g. Computer Science"><br>
									</div>
								</div>
								<div class="C3">
									<div class="c3">
										<label for="Sdate">Start Date *</label><br>
										<input type="month"  class="inputs" id ="Sdate" name="Sdate" required placeholder="e.g. U.S.A"><br>
									</div>
									<div class="c3">
										<label for="Edate">End Date *</label><br>
										<input type="month"  class="inputs" id ="Edate" name="Edate" required><br>
									</div>
								</div>
								<div class="c3" >
									<label for="Desc">Education description </label><br>
									<textarea name="Desc" id="Desc" class="textA"></textarea>
								</div>
								<br>
								<input type="submit" value="Save" class="submit">
							</form>	
						</div>
			</div>
			<br><br>
			
		</div>
  </div>
</body>
</html>
