<body>
	<div class="bod">
		<div class="barreGauche">
			<p>Professional Experience</p>
			<footer class="footer">
				<div class="click" >
					<a class="click1" id="Back" href="thirdPage.html">Go back</a>
				</div>
				<div class="click" >
					<a class="click1" id="Next" href="fifthPage.html">Next</a>

			</footer>

		<div class="bod2">
			<div class="container">
						<div class="container2">
							<header class="block">
								<h2>Professional Experience</h2>	
							</header>
							<form action="">
								<div class="C3">
									<div class="c3">
										<label for="JobT">Job Title * </label><br>
										<input type="text"  class="inputs" id ="JobT" name="JobT" required placeholder="e.g. manager" required><br>
									</div>
									<div class="c3">
										<label for="city">City </label><br>
										<input type="text"  class="inputs" id ="city" name="city"  placeholder="e.g. London"><br>
									</div>
								</div>
								<div class="c3">
									<label for="company">Company * </label><br>
									<input type="text"  class="inputs" id ="company" name="company"  placeholder="e.g. Capgemini" required><br>
								</div>
                <div class="C3">
									<div class="c3">
										<label for="Sdate">Start Date</label><br>
										<input type="month"  class="inputs" id ="Sdate" name="Sdate"><br>
									</div>
									<div class="c3">
										<label for="Edate">End Date </label><br>
										<input type="month"  class="inputs" id ="Edate" name="Edate"><br>
									</div>
								</div>
                <div class="c3" >
									<label for="Desc">Description </label><br>
									<textarea name="Desc" id="Desc" class="textA"></textarea>
								</div>
								<br>
								<input type="submit" value="Save" class="submit">
							</form>	
						</div>
			  </div>
			<br><br>
