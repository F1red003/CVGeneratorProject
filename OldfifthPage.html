<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Additional information</title>
    <link rel="stylesheet" href="fifthPageStyle.css">
</head>
<body>
	<div class="bod">
		<div class="barreGauche">
			<p>Additional information</p>
			<footer class="footer">
				<div class="click" >
					<a class="click1" id="Back" href="thirdPage.html">Go back</a>
				</div>
				<div class="click" >
					<a class="click1" id="Next" href="fifthPage.html">Next</a>
				</div>
			</footer>
		</div>
		<div class="bod2">
			<div class="container">
						<div class="container2">
							<header class="block">
								<h2>Additional information</h2>	
							</header>
							<form action="">
								<div class="c3">
                  <fieldset>
                    <legend>Interest</legend>
                      <div class="C3">
                        <div class="c3">
                          <label for="Interest">Interest</label><br>
                          <input type="text"  class="inputs" id ="Interest" name="Interest" placeholder="e.g. Playing Games"><br>
                        </div>
                        <div class="c3">
                          <label for="Hobbies">Hobbies</label><br>
                          <input type="text"  class="inputs" id ="Hobbies" name="Hobbies" placeholder="e.g. Reading"><br>
                        </div>
                      </div>
                  </fieldset>
								</div>
                <div class="c3">
                  <fieldset>
                    <legend>Languages</legend>
                      <div class="C3">
                        <div class="c3">
                          <label for="Languages">Languages</label><br>
                          <input type="text"  class="inputs" id ="Languages" name="Languages" placeholder="e.g. French"><br>
                        </div>
                        <div class="c3">
                          <label for="level">Level</label><br>
                          <select name="level" id="level" class="inputs">
                            <option value="Select Level">Select Level</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Mother Language">Mother Language</option>
                          </select>
                        </div>
                      </div>
                  </fieldset>
								</div>
                <div class="c3">
                  <fieldset>
                    <legend>Courses</legend>
                    <div class="C3">
                      <div class="c3">
                        <label for="course">course Name * </label><br>
                        <input type="text"  class="inputs" id ="course" name="course" required placeholder="e.g. Git course" required><br>
                      </div>
                      <div class="c3">
                        <label for="Institution">Institution</label><br>
                        <input type="text"  class="inputs" id ="Institution" name="Institution" placeholder="e.g. Harvard"><br>
                      </div>
                    </div>
                    <div class="C3">
                      <div class="c3">
                        <label for="Sdate">Start Date</label><br>
                        <input type="month"  class="inputs" id ="Sdate" name="Sdate"><br>
                      </div>
                      <div class="c3">
                        <label for="Edate">End Date </label><br>
                        <input type="month"  class="inputs" id ="Edate" name="Edate"><br>
                      </div>
                    </div>
                    <div class="c3" >
                      <label for="Desc">Description </label><br>
                      <textarea name="Desc" id="Desc" class="textA"></textarea>
                    </div>
                  </fieldset>
								</div>
								<br>
								<input type="submit" value="Save" class="submit">
							</form>	
						</div>
			  </div>
			<br><br>
			
		</div>
  </div>
</body>
</html>
